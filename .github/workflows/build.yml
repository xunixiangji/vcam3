name: Build Modified APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install apktool
        run: |
          mkdir -p ~/bin
          cat > ~/bin/apktool << 'WRAPPER'
          #!/bin/bash
          java -jar ~/bin/apktool.jar "$@"
          WRAPPER
          chmod +x ~/bin/apktool
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O ~/bin/apktool.jar
          export PATH=~/bin:$PATH
          apktool --version

      - name: Build APK
        run: |
          export PATH=~/bin:$PATH
          apktool b demo_source -o vcam-unsigned.apk --use-aapt2

      - name: Sign APK
        run: |
          # Generate debug keystore
          keytool -genkey -v -keystore debug.keystore \
            -alias debug -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android \
            -dname "CN=Debug,O=Debug,C=US"

          # Find Android build-tools for zipalign and apksigner
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ 2>/dev/null | tail -1)
          echo "Build tools: $BUILD_TOOLS"
          ls "$BUILD_TOOLS" | head -20

          # Zipalign
          "${BUILD_TOOLS}zipalign" -v -p 4 vcam-unsigned.apk vcam-aligned.apk

          # Sign with apksigner (supports v2/v3)
          "${BUILD_TOOLS}apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias debug \
            --key-pass pass:android \
            --out vcam-final.apk \
            vcam-aligned.apk

          # Verify
          "${BUILD_TOOLS}apksigner" verify --verbose vcam-final.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vcam-modified-apk
          path: vcam-final.apk
          retention-days: 30

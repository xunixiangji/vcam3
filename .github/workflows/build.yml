name: Build Modified APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install apktool
        run: |
          mkdir -p ~/bin
          cat > ~/bin/apktool << 'WRAPPER'
          #!/bin/bash
          java -jar ~/bin/apktool.jar "$@"
          WRAPPER
          chmod +x ~/bin/apktool
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O ~/bin/apktool.jar
          export PATH=~/bin:$PATH
          apktool --version

      - name: Build APK
        run: |
          export PATH=~/bin:$PATH
          apktool b demo_source -o vcam-unsigned.apk --use-aapt2

      - name: Sign APK (v1+v2+v3)
        run: |
          # Generate debug keystore
          keytool -genkey -v -keystore debug.keystore \
            -alias debug -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android \
            -dname "CN=Debug,O=Debug,C=US"

          # Zipalign first (required before apksigner)
          zipalign -v -p 4 vcam-unsigned.apk vcam-aligned.apk

          # Sign with apksigner (v1+v2+v3 schemes)
          apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias debug \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out vcam-final.apk \
            vcam-aligned.apk

          # Verify
          apksigner verify --verbose vcam-final.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vcam-modified-apk
          path: vcam-final.apk
          retention-days: 30

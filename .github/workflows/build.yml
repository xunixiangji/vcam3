name: Build VCam APK (Pure Java, arm64)

on:
  push:
    branches: [ main, pure-java ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2

      - name: Build APK
        run: |
          chmod +x gradlew
          echo "=== Compiling ==="
          ./gradlew assembleDebug --stacktrace 2>&1 || true
          echo ""
          echo "=== Build output ==="
          find . -name "*.apk" -type f 2>/dev/null
          find . -path "*/build/outputs/*" -type f 2>/dev/null
          echo ""
          echo "=== Checking for compile errors ==="
          find . -name "*.java" -path "*/com/nvshen/*" | head -20
          echo ""
          echo "=== Java compile errors if any ==="
          ./gradlew compileDebugJavaSources 2>&1 | grep -i "error\|cannot\|symbol\|package" | head -30 || true

      - name: Copy APK
        if: always()
        run: |
          mkdir -p output
          find . -name "*.apk" -type f -exec cp {} output/ \; 2>/dev/null
          ls -la output/ 2>/dev/null || echo "No APK found"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcam-pure-java-apk
          path: output/
          if-no-files-found: warn
          retention-days: 30

name: Build Modified APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install apktool
        run: |
          mkdir -p ~/bin
          # Download apktool wrapper script
          cat > ~/bin/apktool << 'WRAPPER'
          #!/bin/bash
          java -jar ~/bin/apktool.jar "$@"
          WRAPPER
          chmod +x ~/bin/apktool
          # Download apktool jar (use GitHub releases instead of bitbucket)
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O ~/bin/apktool.jar
          export PATH=~/bin:$PATH
          apktool --version

      - name: Build APK
        run: |
          export PATH=~/bin:$PATH
          apktool b demo_source -o vcam-modified.apk --use-aapt2

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android \
            -dname "CN=Debug,O=Debug,C=US"

          jarsigner -keystore debug.keystore -storepass android \
            -signedjar vcam-signed.apk vcam-modified.apk androiddebugkey

          cp vcam-signed.apk vcam-final.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vcam-modified-apk
          path: vcam-final.apk
          retention-days: 30

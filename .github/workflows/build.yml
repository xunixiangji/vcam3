name: Build VCam APK (Pure Java, arm64)

on:
  push:
    branches: [ main, pure-java ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tail -50

      - name: Find and upload APK
        if: success()
        run: |
          echo "=== Finding APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          # Copy to a known location
          mkdir -p output
          find . -name "*.apk" -type f -exec cp {} output/ \;
          ls -la output/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vcam-pure-java-apk
          path: output/
          retention-days: 30

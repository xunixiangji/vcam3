name: Build VCam APK (Pure Java, arm64)

on:
  push:
    branches: [ main, pure-java ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Show project structure
        run: |
          echo "=== Java files ==="
          find . -name "*.java" | sort
          echo ""
          echo "=== Resource files ==="
          find app/src/main/res -name "*.xml" | head -20
          echo ""
          echo "=== build.gradle ==="
          cat app/build.gradle

      - name: Build with full output
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee build_output.txt
          echo ""
          echo "=== ERRORS ==="
          grep -i "error" build_output.txt | head -40
          echo ""
          echo "=== APK FILES ==="
          find . -name "*.apk" -type f

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.txt
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcam-pure-java-apk
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

name: Build Modified APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install apktool
        run: |
          mkdir -p ~/bin
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O ~/bin/apktool
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.10.0.jar -O ~/bin/apktool.jar
          chmod +x ~/bin/apktool
          export PATH=~/bin:$PATH
          apktool --version

      - name: Build APK
        run: |
          export PATH=~/bin:$PATH
          cd demo_source
          apktool b . -o ../vcam-modified.apk --use-aapt2

      - name: Sign APK
        run: |
          # Generate debug keystore
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android \
            -dname "CN=Debug,O=Debug,C=US"

          # Sign
          jarsigner -keystore debug.keystore -storepass android \
            -signedjar vcam-signed.apk vcam-modified.apk androiddebugkey

          # Zipalign (optional, improves performance)
          if command -v zipalign &> /dev/null; then
            zipalign -v 4 vcam-signed.apk vcam-final.apk
          else
            cp vcam-signed.apk vcam-final.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vcam-modified-apk
          path: vcam-final.apk
          retention-days: 30

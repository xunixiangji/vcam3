name: Build VCam APK (Pure Java, arm64)

on:
  push:
    branches: [ main, pure-java ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tail -50

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vcam-pure-java-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        run: |
          echo "=== Build failed. Last 100 lines of output ==="
          find . -name "*.log" -exec tail -50 {} \; 2>/dev/null || true

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.telegram.a1064'
    compileSdk 31

    defaultConfig {
        applicationId "com.telegram.a1064"
        minSdk 25
        targetSdk 31
        versionCode 20329
        versionName "2.0.40"

        ndk {
            // Support both 32-bit and 64-bit
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Use debug signing for CI (MT Manager re-signs for production)
            signingConfig signingConfigs.debug
            // CRITICAL: must NOT be debuggable — CHMP4 binary checks this via dumpsys
            debuggable false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Disable nmmp native protection - all methods are now pure Java
    packagingOptions {
        // No native libs needed for nmmp anymore
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // libsu for root shell
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'
}
